[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberheal-detect"
version = "0.1.0"
description = "Safe ransomware-like and credential-anomaly detection for CyberHeal AI."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<2.3",
    "pydantic>=2.6,<3",
    "scikit-learn>=1.4,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["black>=24.0,<26", "mypy>=1.8,<2", "pytest>=8.0,<9", "ruff>=0.3,<1"]

[project.scripts]
cyberheal-detect = "cyberheal_detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
extend-exclude = '/docs/legacy_openstack/'

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
