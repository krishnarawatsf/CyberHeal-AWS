global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cyberheal-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/cyberheal-operator-token
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "cyberheal_(incidents_total|investigations_total|opa_decisions_total|response_jobs|recovery_verifications_total)"
        action: keep
