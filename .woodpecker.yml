steps:
  lint:
    image: python:3.11-slim
    commands:
      - pip install -r requirements.txt -r requirements-member-b.txt -r requirements-member-c.txt
      - ruff check .
      - black --check .
  typecheck:
    image: python:3.11-slim
    commands:
      - pip install -r requirements.txt -r requirements-member-b.txt -r requirements-member-c.txt
      - mypy src/cyberheal_detect
  tests:
    image: python:3.11-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*
      - pip install -r requirements.txt -r requirements-member-b.txt -r requirements-member-c.txt
      - curl -fsSL https://openpolicyagent.org/downloads/v1.22.2/opa_linux_amd64_static -o /usr/local/bin/opa
      - chmod 0755 /usr/local/bin/opa
      - opa version
      - PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 CYBERHEAL_OPA_EXE=/usr/local/bin/opa pytest -q tests
      - opa test respond/policies -v
  dependency_scan:
    image: python:3.11-slim
    commands:
      - pip install --disable-pip-version-check pip-audit
      - pip-audit -r requirements.txt -r requirements-member-b.txt -r requirements-member-c.txt
  build:
    image: quay.io/podman/stable
    commands:
      - podman build --platform linux/amd64 -t cyberheal-detect:ci .
    when:
      - event: push
        branch: main
